---
layout: kendra_default_no_footer
---
{% assign board = site.data[page.board] %}
<style>
  .pan-viewport {
    position: relative;
    width: 100%;
    height: calc(100vh - 140px);
    min-height: 420px;
    overflow: hidden;
    cursor: grab;
    touch-action: none; /* drag and zoom here, not the page scroll */
    user-select: none;
    background: transparent;
  }
  .pan-viewport.is-dragging { cursor: grabbing; }
  .pan-world {
    position: absolute;
    left: 0;
    top: 0;
    width: {{ board.world_width }}px;
    height: {{ board.world_height }}px;
    transform-origin: 0 0;
  }
  .pan-tile {
    position: absolute;
    display: block;
    max-width: none;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pan-item {
    position: absolute;
    margin: 0;
    pointer-events: none;
  }
  .pan-item[data-enlarge] {
    pointer-events: auto;
    cursor: zoom-in;
  }
  .pan-item img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* A photo given a height keeps its box; the image fills it and crops evenly. */
  .pan-item.is-sized img {
    height: 100%;
    object-fit: cover;
  }
  .pan-item figcaption {
    margin-top: 12px;
    font-family: 'acumin-variable', sans-serif;
    font-size: 26px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a1a1a;
  }
  .pan-text {
    position: absolute;
    z-index: 2; /* titles sit above the photos and posters */
    margin: 0;
    font-family: 'Raleway', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #1a1a1a;
    pointer-events: none;
  }
  /* A plain board sits on a white page with no texture. */
  body.pan-plain {
    background: #fff !important;
  }
  body.pan-plain .pan-hint {
    color: #1a1a1a;
  }
  .pan-hint {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'acumin-variable', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: #fff;
    pointer-events: none;
  }
</style>

<div class="pan-viewport" id="pan-viewport">
  <div class="pan-world" id="pan-world">
    <div class="pan-tiles" id="pan-tiles"></div>
    {% for item in board.items %}
      {% if item.kind == "image" %}
        <figure class="pan-item{% if item.h %} is-sized{% endif %}" style="left: {{ item.x }}px; top: {{ item.y }}px; width: {{ item.w }}px;{% if item.h %} height: {{ item.h }}px;{% endif %} transform: rotate({{ item.rotate | default: 0 }}deg);"data-rot="{{ item.rotate | default: 0 }}"{% if item.enlarge %} data-enlarge{% endif %}>
          <img src="{{ site.baseurl }}{{ item.src }}" alt="{{ item.alt }}" loading="lazy" draggable="false">
          {% if item.caption %}<figcaption>{{ item.caption }}</figcaption>{% endif %}
        </figure>
      {% elsif item.kind == "text" %}
        <p class="pan-text" style="left: {{ item.x }}px; top: {{ item.y }}px; width: {{ item.w }}px; font-size: {{ item.size | default: 16 }}px;{% if item.font %} font-family: {{ item.font }};{% endif %}{% if item.color %} color: {{ item.color }};{% endif %}{% if item.weight %} font-weight: {{ item.weight }};{% endif %}">{{ item.text }}</p>
      {% endif %}
    {% endfor %}
  </div>
  <p class="pan-hint">drag to move · scroll to zoom</p>
</div>

<div class="photo-zoom" id="pan-photo" hidden>
  <img src="" alt="">
</div>

<script>
  (function () {
    {% if board.plain %}document.body.classList.add('pan-plain');{% endif %}
    var viewport = document.getElementById('pan-viewport');
    var world = document.getElementById('pan-world');
    var WORLD_W = {{ board.world_width }};
    var WORLD_H = {{ board.world_height }};
    // Boards without tiles (only photos) leave TILE_PATH null.
    var TILE = {{ board.tiles.size | default: 512 }};
    var LEVELS = {{ board.tiles.levels | default: 1 }};
    var TILE_PATH = {% if board.tiles %}'{{ site.baseurl }}{{ board.tiles.path }}'{% else %}null{% endif %};
    var MAX_SCALE = 4;
    var minScale = 0.05;  // set to the fitted scale in fit()
    var scale = 1, tx = 0, ty = 0;
    var dragging = false, lastX = 0, lastY = 0;

    // Tiles are cut at several resolutions. Only the tiles in view are drawn,
    // at the resolution that matches the current zoom.
    var tilesEl = document.getElementById('pan-tiles');
    var tiles = {};
    var tileLevel = -1;

    function renderTiles() {
      if (!TILE_PATH) return;
      var L = 0;
      while (L < LEVELS - 1 && scale * Math.pow(2, L) < 0.5) L++;
      if (L !== tileLevel) {
        tilesEl.innerHTML = '';
        tiles = {};
        tileLevel = L;
      }
      var k = Math.pow(2, L);
      var span = TILE * k;                           // world px per tile
      var imgW = WORLD_W / k, imgH = WORLD_H / k;    // image px at this level
      var cols = Math.ceil(imgW / TILE), rows = Math.ceil(imgH / TILE);
      var x0 = -tx / scale, y0 = -ty / scale;
      var x1 = x0 + viewport.clientWidth / scale, y1 = y0 + viewport.clientHeight / scale;
      var c0 = Math.max(0, Math.floor(x0 / span)), c1 = Math.min(cols - 1, Math.floor(x1 / span));
      var r0 = Math.max(0, Math.floor(y0 / span)), r1 = Math.min(rows - 1, Math.floor(y1 / span));
      var keep = {};
      for (var r = r0; r <= r1; r++) {
        for (var c = c0; c <= c1; c++) {
          var key = c + '_' + r;
          keep[key] = true;
          if (tiles[key]) continue;
          var img = document.createElement('img');
          img.className = 'pan-tile';
          img.src = TILE_PATH + '/L' + L + '/' + key + '.webp';
          img.alt = '';
          img.draggable = false;
          img.style.left = c * span + 'px';
          img.style.top = r * span + 'px';
          // Edge tiles are smaller than a full tile.
          img.style.width = Math.min(TILE, imgW - c * TILE) * k + 'px';
          img.style.height = Math.min(TILE, imgH - r * TILE) * k + 'px';
          tilesEl.appendChild(img);
          tiles[key] = img;
        }
      }
      Object.keys(tiles).forEach(function (key) {
        if (!keep[key]) {
          tilesEl.removeChild(tiles[key]);
          delete tiles[key];
        }
      });
    }

    function apply() {
      world.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      renderTiles();
    }

    // Start with the whole board visible, centred.
    // The top band is kept clear for the hint, so the board starts below it.
    var TOP_BAND = 48;
    function fit() {
      var vw = viewport.clientWidth, vh = viewport.clientHeight - TOP_BAND;
      var byWidth = vw / WORLD_W, byHeight = vh / WORLD_H;
      if (WORLD_H > WORLD_W * 1.5) {
        // A tall board opens showing its full width, and zooming out stops there too.
        minScale = byWidth * 0.95;
        scale = minScale;
      } else {
        scale = Math.min(byWidth, byHeight) * 0.95;
        minScale = scale;  // zooming out stops at this preset
      }
      tx = (vw - WORLD_W * scale) / 2;
      ty = TOP_BAND + Math.max(0, (vh - WORLD_H * scale) / 2);  // a tall board starts at its top
      apply();
    }

    viewport.addEventListener('wheel', function (e) {
      e.preventDefault();
      var rect = viewport.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      // Scales with how far the wheel moved, so a trackpad and a mouse both feel right.
      var next = Math.min(MAX_SCALE, Math.max(minScale, scale * Math.exp(-e.deltaY * 0.00077)));
      if (next <= minScale) {
        // At the smallest size, centre the whole board.
        var vw = viewport.clientWidth, vh = viewport.clientHeight - TOP_BAND;
        scale = next;
        tx = (vw - WORLD_W * scale) / 2;
        ty = TOP_BAND + Math.max(0, (vh - WORLD_H * scale) / 2);
        apply();
        return;
      }
      // Keep the point under the cursor fixed while zooming.
      tx = mx - (mx - tx) * (next / scale);
      ty = my - (my - ty) * (next / scale);
      scale = next;
      apply();
    }, { passive: false });

    // Enlarged photo: a click (not a drag) on a photo opens it.
    var photo = document.getElementById('pan-photo');
    var photoImg = photo.querySelector('img');
    var downX = 0, downY = 0, downTarget = null;

    // Touch: one finger drags the board, two fingers pinch to zoom, and a finger
    // that rests still over the photos for a moment pushes them away while held.
    var touches = {};
    var pinch = null, pinched = false;
    var lingerTimer = null, lingering = false, lingerX = 0, lingerY = 0;
    var LINGER_MS = 350, MOVE_SLOP = 10, LINGER_PUSH = 0.3;

    function openPhoto(target) {
      var pic = target && target.closest ? target.closest('[data-enlarge] img') : null;
      if (pic) {
        photoImg.src = pic.src;
        photoImg.alt = pic.alt;
        photo.hidden = false;
      }
    }
    function boardPoint(cx, cy) {
      var r = viewport.getBoundingClientRect();
      return { x: (cx - r.left - tx) / scale, y: (cy - r.top - ty) / scale };
    }
    // Pushes the photos near a board point away from it, by an amount.
    function pushAt(px, py, amount) {
      var reach0 = REACH_PX / scale;
      scatter.forEach(function (s) {
        var dx = (s.cx + s.x) - px, dy = (s.cy + s.y) - py;
        var d = Math.sqrt(dx * dx + dy * dy);
        var reach = Math.max(s.w, s.h) / 2 + reach0;
        if (d < reach) {
          var k = (1 - d / reach) * amount;
          var nx = d > 0 ? dx / d : 0, ny = d > 0 ? dy / d : 0;
          s.vx += nx * k;
          s.vy += ny * k;
        }
      });
      kick();
    }
    function lingerLoop() {
      if (!lingering) return;
      var p = boardPoint(lingerX, lingerY);
      pushAt(p.x, p.y, PUSH * LINGER_PUSH);
      requestAnimationFrame(lingerLoop);
    }
    function pinchState() {
      var ids = Object.keys(touches).slice(0, 2);
      var a = touches[ids[0]], b = touches[ids[1]];
      var r = viewport.getBoundingClientRect();
      return {
        dist: Math.hypot(a.x - b.x, a.y - b.y),
        mx: (a.x + b.x) / 2 - r.left,
        my: (a.y + b.y) / 2 - r.top
      };
    }
    function startPinch() {
      var s = pinchState();
      pinch = { dist: s.dist, scale: scale, wx: (s.mx - tx) / scale, wy: (s.my - ty) / scale };
      pinched = true;
      dragging = false;
    }
    function updatePinch() {
      if (!pinch || pinch.dist === 0) return;
      var s = pinchState();
      var next = Math.min(MAX_SCALE, Math.max(minScale, pinch.scale * s.dist / pinch.dist));
      scale = next;
      if (next <= minScale) {
        // At the smallest size, centre the whole board.
        var vw = viewport.clientWidth, vh = viewport.clientHeight - TOP_BAND;
        tx = (vw - WORLD_W * scale) / 2;
        ty = TOP_BAND + Math.max(0, (vh - WORLD_H * scale) / 2);
      } else {
        // The point between the fingers stays put, and the board follows them.
        tx = s.mx - pinch.wx * next;
        ty = s.my - pinch.wy * next;
      }
      apply();
    }
    function endTouch(e) {
      var t = touches[e.pointerId];
      delete touches[e.pointerId];
      var remaining = Object.keys(touches);
      if (remaining.length === 0) {
        // A tap (no move, no pinch, no hold) opens the photo under the finger.
        if (t && !t.moved && !lingering && !pinched) openPhoto(t.target);
        clearTimeout(lingerTimer);
        lingering = false;
        pinch = null; pinched = false;
        dragging = false;
        viewport.classList.remove('is-dragging');
      } else if (remaining.length === 1) {
        // One finger lifted from a pinch: carry on panning with the other.
        pinch = null;
        var rest = touches[remaining[0]];
        rest.moved = true;
        lastX = rest.x; lastY = rest.y;
        dragging = true;
      }
    }
    function stop() {
      dragging = false;
      viewport.classList.remove('is-dragging');
    }

    viewport.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') {
        touches[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, target: e.target };
        try { viewport.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
        var n = Object.keys(touches).length;
        if (n === 1) {
          dragging = true;
          lastX = e.clientX; lastY = e.clientY;
          lingerX = e.clientX; lingerY = e.clientY;
          viewport.classList.add('is-dragging');
          var id = e.pointerId;
          clearTimeout(lingerTimer);
          lingerTimer = setTimeout(function () {
            var t = touches[id];
            if (t && !t.moved && Object.keys(touches).length === 1) {
              lingering = true;
              lingerLoop();
            }
          }, LINGER_MS);
        } else if (n === 2) {
          clearTimeout(lingerTimer);
          lingering = false;
          startPinch();
        }
        return;
      }
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      downX = e.clientX; downY = e.clientY;
      downTarget = e.target;
      viewport.classList.add('is-dragging');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') {
        var t = touches[e.pointerId];
        if (!t) return;
        t.x = e.clientX; t.y = e.clientY;
        if (Object.keys(touches).length >= 2) { updatePinch(); return; }
        if (!t.moved) {
          if (Math.hypot(t.x - t.sx, t.y - t.sy) <= MOVE_SLOP) return;
          // Moving past the slop means panning, so the hold is off. Pan from
          // where the finger first touched down.
          t.moved = true;
          clearTimeout(lingerTimer);
          lingering = false;
          lastX = t.sx; lastY = t.sy;
          dragging = true;
        }
        if (!dragging) return;
        tx += e.clientX - lastX; ty += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        apply();
        return;
      }
      if (!dragging) return;
      tx += e.clientX - lastX; ty += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      apply();
    });
    viewport.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'touch') { endTouch(e); return; }
      var moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6;
      if (!moved) openPhoto(downTarget);
      stop();
    });
    photo.addEventListener('click', function () { photo.hidden = true; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') photo.hidden = true;
    });
    viewport.addEventListener('pointercancel', function (e) {
      if (e.pointerType === 'touch') { endTouch(e); return; }
      stop();
    });

    // Hover-disperse: photos are pushed away from the pointer as it passes
    // over them, then spring back to their home position.
    var STIFF = 0.04, DAMP = 0.9, PUSH = 60, REACH_PX = 120;
    var scatter = [].slice.call(world.querySelectorAll('.pan-item[data-enlarge]')).map(function (el) {
      return { el: el, rot: parseFloat(el.dataset.rot) || 0, x: 0, y: 0, vx: 0, vy: 0, cx: 0, cy: 0, w: 0, h: 0 };
    });
    function measureScatter() {
      scatter.forEach(function (s) {
        s.w = s.el.offsetWidth; s.h = s.el.offsetHeight;
        s.cx = s.el.offsetLeft + s.w / 2; s.cy = s.el.offsetTop + s.h / 2;
      });
    }
    var running = false;
    function step() {
      var moving = false;
      scatter.forEach(function (s) {
        s.vx = (s.vx - STIFF * s.x) * DAMP;
        s.vy = (s.vy - STIFF * s.y) * DAMP;
        s.x += s.vx; s.y += s.vy;
        if (Math.abs(s.x) < 0.05 && Math.abs(s.y) < 0.05 && Math.abs(s.vx) < 0.05 && Math.abs(s.vy) < 0.05) {
          s.x = 0; s.y = 0; s.vx = 0; s.vy = 0;
        } else {
          moving = true;
        }
        s.el.style.transform = 'translate(' + s.x + 'px, ' + s.y + 'px) rotate(' + s.rot + 'deg)';
      });
      if (moving) { requestAnimationFrame(step); } else { running = false; }
    }
    function kick() {
      if (!running) { running = true; requestAnimationFrame(step); }
    }
    // Mouse: photos are pushed away as the pointer passes over them. Touch uses
    // the press-and-hold above instead.
    viewport.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      // The pointer in board coordinates, so the reach stays the same on screen at any zoom.
      var p = boardPoint(e.clientX, e.clientY);
      pushAt(p.x, p.y, PUSH);
    });

    // Images load after the layout, so fit once they are in.
    window.addEventListener('load', function () { fit(); measureScatter(); });
    window.addEventListener('resize', function () { fit(); measureScatter(); });
    fit();
    measureScatter();
  })();
</script>
