<script>
  // Each bar gets a random colour every time the page loads.
  document.querySelectorAll('.word-grid .word').forEach(function (word) {
    var hue = Math.floor(Math.random() * 360);
    word.style.setProperty('--bar', 'hsl(' + hue + ', 90%, 55%)');
  });
</script>
