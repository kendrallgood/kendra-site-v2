---
layout: kendra_default
---
{% if site.data.projects %}
    <div id="projects-source" hidden>
        {% for project in site.data.projects.projects %}
        {% unless project.hidden %}
        <a class="project-source"
           data-category="{{ project.category | default: 'textile' }}"
           data-title="{{ project.title }}"
           data-year="{{ project.year }}"
           data-image="{{ site.baseurl }}{{ project.spotlight_image_url }}"
           href="{{ site.baseurl }}{{ project.project_url }}"></a>
        {% endunless %}
        {% endfor %}
    </div>

    <div class="projects-filter" id="projects-filter">
        <button class="projects-filter__pill is-active" data-cat="all" type="button">All work</button>
        <button class="projects-filter__pill" data-cat="textile" type="button">Textile design</button>
        <button class="projects-filter__pill" data-cat="footwear" type="button">Footwear &amp; material design</button>
    </div>

    <div class="projects-checkerboard" id="projects-grid"></div>

    <p class="projects-empty" id="projects-empty" hidden>More footwear &amp; material design work coming soon.</p>
{% endif %}

<script>
  (function () {
    var sourceEls = document.querySelectorAll('#projects-source .project-source');
    var items = Array.prototype.map.call(sourceEls, function (el) {
      return {
        category: el.dataset.category,
        title: el.dataset.title,
        year: el.dataset.year,
        image: el.dataset.image,
        url: el.getAttribute('href')
      };
    });

    var grid = document.getElementById('projects-grid');
    var empty = document.getElementById('projects-empty');
    var pills = document.querySelectorAll('.projects-filter__pill');
    var currentCat = 'all';
    var GAP = 8;
    var MAX_TILE = 300;

    function getCols() {
      var w = window.innerWidth;
      if (w < 480) return 2;
      if (w < 768) return 4;
      return 6;
    }

    function render(cat) {
      currentCat = cat;

      // Reset any sizing from a previous render so width measurement below
      // reflects the natural full-width container, not a leftover fixed size.
      // The auto margin must go too: on a flex-column body it stops the grid
      // from stretching, so it would measure its shrunken previous width.
      grid.style.width = '';
      grid.style.margin = '';
      grid.style.gridTemplateColumns = '';
      grid.style.gridAutoRows = '';
      grid.style.gap = '';
      grid.innerHTML = '';

      var textileItems = items.filter(function (p) { return p.category === 'textile'; });
      var footwearItems = items.filter(function (p) { return p.category === 'footwear'; });

      if (textileItems.length === 0 && footwearItems.length === 0) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      var cols = getCols();

      // Board shape stays consistent across all three tabs: sized to
      // whichever category has more items, so an empty category still
      // shows a full board of placeholders rather than nothing.
      var targetRows = Math.max(
        Math.ceil((textileItems.length * 2) / cols),
        Math.ceil((footwearItems.length * 2) / cols),
        1
      );

      // Size tiles to fill the available width, capped so they don't get
      // oversized on very wide screens. The page scrolls if needed.
      var gridStyle = getComputedStyle(grid);
      var padX = parseFloat(gridStyle.paddingLeft) + parseFloat(gridStyle.paddingRight);
      var availableWidth = grid.clientWidth - padX;
      var widthFit = (availableWidth - (cols - 1) * GAP) / cols;
      var tileSize = Math.max(80, Math.min(widthFit, MAX_TILE));

      grid.style.gridTemplateColumns = 'repeat(' + cols + ', ' + tileSize + 'px)';
      grid.style.gridAutoRows = tileSize + 'px';
      grid.style.gap = GAP + 'px';
      grid.style.width = (cols * tileSize + (cols - 1) * GAP + padX) + 'px';
      grid.style.margin = '0 auto';

      function placeTile(p, col, row) {
        var tile = document.createElement('a');
        tile.className = 'checker-tile';
        tile.href = p.url;
        tile.style.gridColumn = String(col + 1);
        tile.style.gridRow = String(row + 1);
        tile.innerHTML =
          '<img class="checker-tile__img" src="' + p.image + '" loading="lazy" alt="' + p.title + '">' +
          '<div class="checker-tile__overlay">' +
            '<p class="checker-tile__title">' + p.title + '</p>' +
            '<p class="checker-tile__year">(' + p.year + ')</p>' +
          '</div>';
        grid.appendChild(tile);
      }

      function placePlaceholder(col, row) {
        var ph = document.createElement('div');
        ph.className = 'checker-placeholder';
        ph.style.gridColumn = String(col + 1);
        ph.style.gridRow = String(row + 1);
        grid.appendChild(ph);
      }

      var tIdx = 0;
      var fIdx = 0;

      for (var row = 0; row < targetRows; row++) {
        for (var col = 0; col < cols; col++) {
          var phase = (row + col) % 2;
          var showTextile = (cat === 'all' || cat === 'textile') && phase === 0 && tIdx < textileItems.length;
          var showFootwear = (cat === 'all' || cat === 'footwear') && phase === 1 && fIdx < footwearItems.length;
          if (showTextile) {
            placeTile(textileItems[tIdx], col, row);
            tIdx++;
          } else if (showFootwear) {
            placeTile(footwearItems[fIdx], col, row);
            fIdx++;
          } else {
            placePlaceholder(col, row);
          }
        }
      }
    }

    pills.forEach(function (pill) {
      pill.addEventListener('click', function () {
        pills.forEach(function (p) { p.classList.remove('is-active'); });
        pill.classList.add('is-active');
        render(pill.dataset.cat);
      });
    });

    var resizeTimer;
    function scheduleRerender() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        render(currentCat);
      }, 150);
    }

    if (window.ResizeObserver) {
      var ro = new ResizeObserver(scheduleRerender);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener('resize', scheduleRerender);
    }
    window.addEventListener('focus', scheduleRerender);

    render('all');
  })();
</script>
